# nginx interno del contenedor web (Fase 6).
# Sirve la app compilada y redirige la API al contenedor `api`.
# El prefijo público (/atlas/) lo retira el nginx del host al pasar
# la petición a este contenedor: aquí todo cuelga de la raíz.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # La carcasa y el service worker no se cachean en el navegador:
    # cada despliegue se detecta al momento. Los assets con huella
    # en el nombre sí pueden cachearse sin límite (son inmutables).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

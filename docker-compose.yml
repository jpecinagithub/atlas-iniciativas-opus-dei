# Solo para DESARROLLO local: PostgreSQL propio del proyecto.
# No es la decisión de producción (eso es la D7, en la Fase 6).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev
      POSTGRES_DB: atlas
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - atlas-db:/var/lib/postgresql/data
volumes:
  atlas-db:

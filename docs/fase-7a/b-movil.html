<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>B · Móvil</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:390px; height:844px; overflow:hidden; background:#04070D; font-family:-apple-system,"Segoe UI",Roboto,sans-serif; color:#EAF0FA; }
  .map { position:absolute; inset:0; width:390px; height:844px; object-fit:cover; }
  .glow { position:absolute; left:50%; top:40%; width:480px; height:480px; transform:translate(-50%,-50%); background:radial-gradient(circle, rgba(64,110,190,.22) 0%, rgba(64,110,190,0) 62%); }
  .word { position:absolute; left:18px; top:16px; font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:#DCE7F7; }
  .word span { color:#E8A33D; }
  .search { position:absolute; left:16px; right:16px; top:48px; height:46px; border-radius:23px; background:rgba(10,17,32,.66); border:1px solid rgba(255,255,255,.16); backdrop-filter:blur(10px); display:flex; align-items:center; padding:0 18px; font-size:13.5px; color:#93A7C6; }
  .cl { position:absolute; border-radius:50%; border:1.5px solid rgba(232,163,61,.9); background:rgba(232,163,61,.13); box-shadow:0 0 18px rgba(232,163,61,.35); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; }
  .sheet { position:absolute; left:0; right:0; bottom:0; border-radius:22px 22px 0 0; background:rgba(8,13,25,.78); border-top:1px solid rgba(255,255,255,.14); backdrop-filter:blur(14px); padding:10px 18px 20px; }
  .sheet .grab { width:42px; height:4.5px; border-radius:3px; background:rgba(255,255,255,.3); margin:0 auto 14px; }
  .sheet .big { font-size:21px; font-weight:300; line-height:1.3; }
  .sheet .big em { font-style:normal; color:#E8A33D; }
  .sheet .sub { font-size:12px; color:#8CA3C7; margin-top:4px; }
  .chips { display:flex; gap:7px; margin-top:14px; overflow:hidden; }
  .chip { white-space:nowrap; font-size:12px; border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:7px 12px; background:rgba(255,255,255,.04); }
  .chip.hot { background:#E8A33D; color:#131A29; border-color:#E8A33D; font-weight:600; }
</style></head>
<body>
  <img class="map" src="mundo-b.svg" alt="">
  <div class="glow"></div>
  <div class="word">Atlas<span> · </span>Opus Dei</div>
  <div class="search">Busca un lugar o una iniciativa…</div>
  <div class="cl" style="left:196px; top:262px; width:44px; height:44px;">311</div>
  <div class="cl" style="left:252px; top:246px; width:36px; height:36px;">225</div>
  <div class="cl" style="left:110px; top:392px; width:32px; height:32px;">117</div>
  <section class="sheet">
    <div class="grab"></div>
    <p class="big"><em>1.382</em> iniciativas en <em>70</em> países</p>
    <p class="sub">942 con ubicación en el mapa · Directorio v14 verificado</p>
    <div class="chips"><span class="chip hot">Explorar países →</span><span class="chip">Colegios · 389</span><span class="chip">Centros de mujeres · 210</span></div>
  </section>
</body></html>
